name: Tests
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Headless smoke test (fake Tk, no display needed)
        run: python -X faulthandler tests/smoke_test.py
